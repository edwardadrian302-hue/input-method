# ChaoxiPinyin: full pinyin using pinned rime-ice dictionaries; no Rime user dictionary.
schema:
  schema_id: chaoxipinyin
  name: 潮汐拼音
  version: "0.5.0"
switches:
  - name: ascii_mode
    reset: 0
engine:
  processors: [key_binder, speller, punctuator, selector, navigator, express_editor]
  segmentors: [abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [uniquifier]
menu:
  page_size: 9
speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba"
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    - derive/^([nl])ue$/$1ve/
    - derive/^([jqxy])u/$1v/
translator:
  dictionary: chaoxi
  prism: chaoxipinyin
  enable_user_dict: false
  enable_sentence: true
  enable_completion: true
  enable_word_completion: false
  contextual_suggestions: false
key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }
punctuator:
  half_shape:
    ",": { commit: "，" }
    ".": { commit: "。" }
    "!": { commit: "！" }
    "?": { commit: "？" }
    ":": { commit: "：" }
    ";": { commit: "；" }
    "(": "（"
    ")": "）"
    "[": "【"
    "]": "】"
    '"': { pair: ["“", "”"] }
    "'": { pair: ["‘", "’"] }
