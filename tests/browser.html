<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>简拼浏览器验收</title>
<style>body{font:18px system-ui;max-width:760px;margin:40px auto;padding:20px;background:#f6f7fb;color:#222}input,textarea,[contenteditable]{font:22px system-ui;box-sizing:border-box;width:100%;padding:14px;border:1px solid #aab4c6;border-radius:8px;background:white;margin:10px 0 24px}textarea,[contenteditable]{min-height:130px}</style>
<h1>简拼 · 浏览器验收</h1><p>这是完全本地的测试页，无脚本、网络请求和输入记录。先使用 Win + 空格选择简拼。</p>
<label>普通输入框：nihk → 你好<input autocomplete="off"></label>
<label>多行文本：测试选词、标点、换行<textarea autocomplete="off"></textarea></label>
<p>富文本区域：测试连续输入和移动光标</p><div contenteditable="true" spellcheck="false"></div>
<label>密码框：应该直接输入，不出现候选<input type="password" autocomplete="new-password"></label>
<label>第二个输入框：测试焦点切换<input autocomplete="off"></label>
</html>
